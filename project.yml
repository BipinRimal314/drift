name: Drift
options:
  bundleIdPrefix: com.bipinrimal
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Drift:
    type: application
    platform: macOS
    sources:
      - path: Drift/App
      - path: Drift/Core
      - path: Drift/Panel
      - path: Drift/Theme
      - path: Drift/Utilities
    resources:
      - path: Drift/Resources/Assets.xcassets
      - path: Drift/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bipinrimal.drift
        PRODUCT_NAME: Drift
        CODE_SIGN_ENTITLEMENTS: Drift/Resources/Drift.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Drift/Resources/Info.plist
      properties:
        LSUIElement: true
        ATSApplicationFontsPath: Fonts
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"

  DriftTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DriftTests
    dependencies:
      - target: Drift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bipinrimal.drift.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Drift.app/Contents/MacOS/Drift"
        GENERATE_INFOPLIST_FILE: YES
