name: DriftQA
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  DriftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DriftUITests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bipinrimal.drift.mobile.qa
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ""
schemes:
  DriftQA:
    build:
      targets:
        DriftUITests: [test]
    test:
      targets: [DriftUITests]
